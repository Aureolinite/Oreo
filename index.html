<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Doodles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>My Doodle Gallery</h1>
  <button id="toggle">🌃 Night Mode</button>
  <div id="lightbox">
  <span id="close">&times;</span>
  <img id="lightbox-img" src="" alt="">
  <p id="lightbox-caption"></p>
</div>
<script src="script.js"></script>
</button>
  <div class="gallery">
    <figure>
      <img src="images/doodle1.png" alt="A doodle of a panda">
      <figcaption>Panda with award</figcaption>
    </figure>

    <figure>
      <img src="images/doodle2.png" alt="A doodle of a panda">
      <figcaption>Surfer panda</figcaption>
    </figure>
    
    <figure>
      <img src="images/doodle3.png" alt="A drawing of something"
      <figcaption>Viking (BBB)</figcaption>
    </figure>
  </div>
</body>
</html>
