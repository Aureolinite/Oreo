<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Doodles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>My Doodle Gallery</h1>
  <button id="toggle">🌃 Night Mode</button>
  <div id="lightbox">
  <span id="close">&times;</span>
  <img id="lightbox-img" src="" alt="">
  <p id="lightbox-caption"></p>
</div>
<script>
  const btn = document.getElementById("toggle");
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
  }

  btn.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
  });
  const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxCaption = document.getElementById("lightbox-caption");

document.querySelectorAll(".gallery img").forEach((img) => {
  img.addEventListener("click", () => {
    lightboxImg.src = img.src;
    lightboxImg.alt = img.alt;
    lightboxCaption.textContent = img.alt;
    lightbox.classList.add("open");
  });
});

function closeLightbox() {
  lightbox.classList.remove("open");
}

// Click anywhere on the dark area (but not the image) to close
lightbox.addEventListener("click", (e) => {
  if (e.target !== lightboxImg) closeLightbox();
});

// Press Escape to close
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeLightbox();
});
</script>
</button>
  <div class="gallery">
    <figure>
      <img src="images/doodle1.png" alt="A doodle of a panda">
      <figcaption>Panda with award</figcaption>
    </figure>

    <figure>
      <img src="images/doodle2.png" alt="A doodle of a panda">
      <figcaption>Surfer panda</figcaption>
    </figure>
    
    <figure>
      <img src="images/doodle3.png" alt="A drawing of something"
      <figcaption>Viking</figcaption>
    </figure>
  </div>
</body>
</html>
